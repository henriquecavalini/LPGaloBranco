<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Galo Branco</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="painel.css?v=2">
    <link rel="icon" type="image/png" href="logofavicon.png">
    <script src="https://kit.fontawesome.com/f58d7da5e6.js" crossorigin="anonymous"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
</head>
<body class="painel-body">

    <!-- Tela de Login -->
    <div id="login-screen" class="screen-active">
        <div class="login-box">
            <img src="logo.png" alt="Logo Galo Branco" class="login-logo">
            <h2>Acesso Restrito</h2>
            <p>Digite o CNPJ da empresa para acessar o painel de promoções.</p>
            <input type="text" id="cnpj-input" placeholder="00.000.000/0000-00" maxlength="18">
            <button id="btn-login" class="btn-cta btn-primary" style="width: 100%; margin-top: 15px;">Entrar</button>
            <div id="login-error" class="error-msg" style="display: none;">CNPJ Inválido!</div>
        </div>
    </div>

    <!-- Tela do Dashboard -->
    <div id="dashboard-screen" class="screen-hidden">
        <header class="painel-header">
            <div class="container painel-header-content">
                <div class="logo-area">
                    <img src="logo.png" alt="Logo">
                    <h3>Painel Galo Branco</h3>
                </div>
                <button id="btn-logout" class="btn-outline"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
            </div>
        </header>

        <div class="container painel-main">
            <div class="painel-topo">
                <h2>Gerenciar Promoções</h2>
                <button id="btn-nova-promo" class="btn-cta btn-primary"><i class="fa-solid fa-plus"></i> Nova Promoção</button>
            </div>

            <div class="promocoes-lista-admin" id="lista-admin">
                <!-- Promoções vão aparecer aqui -->
                <div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Carregando...</div>
            </div>
        </div>
    </div>

    <!-- Modal Adicionar/Editar -->
    <div id="modal-promo" class="modal-hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Nova Promoção</h3>
                <button id="btn-close-modal" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <form id="form-promo">
                    <input type="hidden" id="promo-id">
                    
                    <div class="form-group">
                        <label>Nome do Combo/Produto</label>
                        <input type="text" id="promo-titulo" required placeholder="Ex: Combo Refrescante">
                    </div>

                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea id="promo-desc" required placeholder="Descrição rápida do combo..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Preço Antigo (Opcional)</label>
                            <input type="text" id="promo-preco-velho" placeholder="Ex: R$ 15,90">
                        </div>
                        <div class="form-group">
                            <label>Preço Atual</label>
                            <input type="text" id="promo-preco-novo" required placeholder="Ex: R$ 9,90">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Mensagem do WhatsApp (Quando cliente clica)</label>
                        <input type="text" id="promo-wpp" required placeholder="Ex: Gostaria de pedir o Combo Refrescante">
                    </div>

                    <div class="form-group">
                        <label>Foto do Produto</label>
                        <label for="promo-foto" class="custom-file-upload">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span>Clique para procurar uma imagem no seu computador</span>
                        </label>
                        <input type="file" id="promo-foto" accept="image/*">
                        <div id="foto-preview" class="foto-preview">Nenhuma foto selecionada.</div>
                        <input type="hidden" id="promo-foto-url"> <!-- Guarda a URL da foto caso esteja apenas editando texto -->
                    </div>

                    <div class="form-actions">
                        <button type="button" id="btn-cancel-modal" class="btn-outline btn-modal-action">Cancelar</button>
                        <button type="submit" id="btn-save-promo" class="btn-cta btn-primary btn-modal-action">Salvar Promoção</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="painel.js?v=2"></script>
</body>
</html>
